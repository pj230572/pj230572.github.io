<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

/* Header */
header {
  background: #222;
  color: #fff;
  padding: 15px;
  text-align: center;
}

/* Search */
.search-box {
  padding: 10px;
  text-align: center;
  background: #fff;
}

.search-box input {
  width: 90%;
  max-width: 500px;
  padding: 10px;
  font-size: 16px;
}

/* Blog Grid */
#posts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  padding: 15px;
}

/* Responsive */
@media (max-width: 900px) {
  #posts {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  #posts {
    grid-template-columns: 1fr;
  }
}

/* Card */
.post-card {
  background: #fff;
  padding: 15px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.post-card:hover {
  transform: scale(1.03);
}

.post-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 5px;
}

.post-date {
  font-size: 12px;
  color: gray;
}
#loader{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:50px;
}

.spinner{
  width:50px;
  height:50px;
  border:5px solid #ddd;
  border-top:5px solid #007bff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<header>
  <h2>My Blog</h2>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Search posts...">
</div>
<div id="loader">
  <div class="spinner"></div>
</div>
<div id="posts"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw8zTI9WW_tj_dv3jpY8RGdO-16uiuYkXjH6NtR3C6Azt60LsaGR01ATjRwvd6kH78Vxg/exec";

let posts = [];

// Load posts from Google Sheets
function loadPosts() {
  fetch(API_URL + "?action=getPosts")
    .then(res => res.json())
    .then(data => {
      posts = data.reverse(); // latest first
	  document.getElementById("loader").style.display = "none";
      renderPosts(posts);
    });
}

// Render posts
function renderPosts(data) {
  let container = document.getElementById("posts");
  container.innerHTML = "";

  data.forEach(post => {
    container.innerHTML += `
      <div class="post-card" onclick="goToPost('${post.id}')">
        <div class="post-title">${post.title}</div>
        <div class="post-date">${formatDate(post.date)}</div>
      </div>
    `;
  });
}

// Go to single post page
function goToPost(id) {
  window.location.href = "post.html?id=" + id;
}

// Format date nicely
function formatDate(dateStr) {
  let d = new Date(dateStr);
  return d.toDateString();
}

// Search
document.getElementById("search").addEventListener("input", function() {
  let value = this.value.toLowerCase();
  let filtered = posts.filter(p => p.title.toLowerCase().includes(value));
  renderPosts(filtered);
});

// Init
loadPosts();

</script>

</body>
</html>
