<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>

body{
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
}

.container{
  max-width:800px;
  margin:auto;
  background:#fff;
  padding:20px;
  margin-top:30px;
  border-radius:10px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  box-sizing:border-box;
}

textarea{
  height:300px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#007bff;
  color:#fff;
  border:none;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#0056b3;
}

#message{
  margin-top:15px;
  font-weight:bold;
}

</style>
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
</head>

<body>

<div class="container">

  <h2>Create Blog Post</h2>

  <input type="password" id="password" placeholder="Admin Password">

  <input type="text" id="title" placeholder="Post Title">

  <textarea id="content" placeholder="Write blog content here..."></textarea>

  <button onclick="publishPost()">
    Publish Post
  </button>

  <div id="message"></div>

</div>

<hr>

<h2>All Posts</h2>

<div id="post-list"></div>


  <script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw8zTI9WW_tj_dv3jpY8RGdO-16uiuYkXjH6NtR3C6Azt60LsaGR01ATjRwvd6kH78Vxg/exec";

// =======================
// GLOBAL
// =======================

let editingPostId = null;

// =======================
// PUBLISH / UPDATE POST
// =======================

function publishPost(){

  const password =
    document.getElementById("password").value;

  const title =
    document.getElementById("title").value;

  const content =
    CKEDITOR.instances.content.getData();

  // validation
  if(title.trim() === ""){
    alert("Enter title");
    return;
  }

  if(content.trim() === ""){
    alert("Enter content");
    return;
  }

  // detect action
  const actionType =
    editingPostId
    ? "updatePost"
    : "addPost";

  fetch(API_URL, {

    method:"POST",

    body:new URLSearchParams({

      action: actionType,

      postId: editingPostId || "",

      password: password,

      title: title,

      content: content

    })

  })

  .then(res => res.json())

  .then(data => {

    console.log(data);

    if(data.status === "success"){

      // add post
      if(actionType === "addPost"){

        document.getElementById("message").innerHTML = `
          ✅ Post Published
          <br><br>

          <a href="post.html?id=${data.postId}"
             target="_blank">

             Open Post

          </a>
        `;

      }

      // update post
      else{

        document.getElementById("message").innerHTML =
          "✅ Post Updated";

      }

      // reset form
      document.getElementById("title").value = "";

      CKEDITOR.instances.content.setData("");

      editingPostId = null;

      loadAdminPosts();

    }

    else{

      document.getElementById("message").innerHTML =
        data.message;

    }

  })

  .catch(error => {

    console.log(error);

    alert("Error saving post");

  });

}

// =======================
// LOAD POSTS
// =======================

function loadAdminPosts(){

  fetch(API_URL + "?action=getPosts")

  .then(res => res.json())

  .then(data => {

    let html = "";

    data.reverse().forEach(post => {

      html += `

      <div style="
        background:#f1f1f1;
        padding:10px;
        margin-top:10px;
      ">

        <b>${post.title}</b>

        <br><br>

        <button onclick="editPost('${post.id}')">
          Edit
        </button>

        <button onclick="deletePost('${post.id}')">
          Delete
        </button>

      </div>

      `;

    });

    document.getElementById("post-list").innerHTML =
      html;

  });

}

// =======================
// EDIT POST
// =======================

function editPost(id){

  fetch(
    API_URL +
    "?action=getPostById&postId=" + id
  )

  .then(res => res.json())

  .then(post => {

    editingPostId = post.id;

    document.getElementById("title").value =
      post.title;

    CKEDITOR.instances.content.setData(
      post.content
    );

    document.getElementById("message").innerHTML =
      "✏️ Editing Post";

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  });

}

// =======================
// DELETE POST
// =======================

function deletePost(id){

  const password =
    document.getElementById("password").value;

  if(password.trim() === ""){
    alert("Enter admin password");
    return;
  }

  if(!confirm("Delete this post?")){
    return;
  }

  fetch(API_URL, {

    method:"POST",

    body:new URLSearchParams({

      action:"deletePost",

      postId:id,

      password:password

    })

  })

  .then(res => res.json())

  .then(data => {

    alert(data.message);

    loadAdminPosts();

  });

}

// =======================
// CKEDITOR
// =======================

CKEDITOR.replace('content', {
  height: 400
});

// =======================
// AUTO LOAD POSTS
// =======================

window.onload = function(){

  loadAdminPosts();

};

</script>



<script>

CKEDITOR.replace('content', {
  height: 400
});
// LOAD POSTS
loadAdminPosts();
</script>
</body>
</html>
